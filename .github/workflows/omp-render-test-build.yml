name: OMP rendering test builds

on:
  push:
    branches:
      - fix/omp-render-consistency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: target/release/herdr
            artifact: herdr-omp-test-linux-x64
          - os: windows-latest
            exe: target/release/herdr.exe
            artifact: herdr-omp-test-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust 1.96.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile release binary
        run: cargo build --release --locked --bin herdr
      - name: Run rendering tests
        run: cargo test --locked --bin herdr client_shell
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 14
